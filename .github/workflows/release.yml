name: Compilar y publicar Santa Elena
on:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: santa-elena-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - id: version
        run: |
          node -e "const v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Usa una versión estable');if(require('./app/config.cjs').version!==v)throw Error('Actualiza también app/config.cjs');console.log('value='+v)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        id: release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag: 'v'+process.env.VERSION});
              core.setOutput('publish','false');
              core.notice('Esta versión ya está publicada. Incrementa package.json y app/config.cjs para publicar otra.');
            } catch (error) {
              if(error.status!==404)throw error;
              core.setOutput('publish','true');
            }
  build:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run build:win
          - os: macos-latest
            platform: mac
            command: npm run build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar firma de Mac si hay certificados
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "const names=['MAC_CSC_LINK','MAC_CSC_KEY_PASSWORD','APPLE_ID','APPLE_APP_SPECIFIC_PASSWORD','APPLE_TEAM_ID'];const n=names.filter(k=>process.env[k]).length;if(n&&n!==names.length)throw Error('Completa todos los secretos de firma y notarización');require('fs').writeFileSync('app/build-info.json',JSON.stringify({macSigned:n===names.length}));"
      - name: Compilar paquetes
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: paquetes-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paquetes-*
          merge-multiple: true
          path: release
      - name: Publicar versión completa
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test -f release/latest.yml
          test -f release/latest-mac.yml
          cd release
          sha256sum *.exe *.dmg *.zip > SHA256.txt
          cd ..
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "Santa Elena $VERSION" --notes-file RELEASE-NOTES.txt --latest
